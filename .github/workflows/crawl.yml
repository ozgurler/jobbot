name: Daily job crawl

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["crawl.py", "profile.json", "companies.json", ".github/workflows/crawl.yml"]

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl
        run: python crawl.py
      - name: Commit results
        run: |
          git config user.name "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          git add data/
          git commit -m "crawl: $(date -u +%F)" || echo "nothing to commit"
          git push
